ShortDescription: Press a key when your PC stutters – WhyLag shows what happened in the seconds before, with evidence.
Description: |-
  WhyLag is a local flight recorder for stutters, freezes and lag on Windows. It keeps a short rolling history of
  CPU, disk, memory, GPU, frame times, Wi-Fi and network latency in memory. When something lags, press a hotkey and
  WhyLag correlates what happened with transparent rules and shows the measured evidence. Optional plain-language
  explanations use a local AI model through Ollama. No telemetry, no admin rights.
