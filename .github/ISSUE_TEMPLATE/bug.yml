name: Bug report
description: WhyLag crashes, shows an error or does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from %LOCALAPPDATA%\WhyLag\logs\whylag.log and the status bar text, if any.
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: version
    attributes:
      label: WhyLag version
  - type: input
    id: ollama
    attributes:
      label: Ollama version and model (only for AI problems)
