name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Code signing runs only once the SignPath project is set up (repository variables and secret, see README).
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match version $version" }

      - name: Test
        run: dotnet test WhyLag.slnx --configuration Release

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1

      - name: Upload binaries for signing
        if: env.SIGN == 'true'
        id: unsigned-binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-binaries
          path: |
            artifacts/WhyLag/WhyLag.exe
            artifacts/WhyLag/whylag-cli.exe

      - name: Sign binaries (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: whylag
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.unsigned-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed

      - name: Use signed binaries
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item artifacts/signed/*.exe artifacts/WhyLag -Force
          $zip = Get-ChildItem artifacts/*-portable.zip
          Remove-Item $zip
          Compress-Archive -Path artifacts/WhyLag/* -DestinationPath $zip.FullName

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./build/build-installer.ps1

      - name: Upload installer for signing
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installer
          path: artifacts/*-setup.exe

      - name: Sign installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: whylag
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed-installer

      - name: Use signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item artifacts/signed-installer/*-setup.exe artifacts -Force

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File -Include *.exe, *.zip -Recurse -Depth 0 |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:TAG --draft --generate-notes --title "WhyLag $env:TAG" `
            (Get-ChildItem artifacts/*-setup.exe).FullName (Get-ChildItem artifacts/*-portable.zip).FullName artifacts/SHA256SUMS.txt

      - name: winget manifests
        shell: pwsh
        run: ./build/winget/New-WingetManifest.ps1 -Owner "${{ github.repository_owner }}" -Repository "${{ github.event.repository.name }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: winget-manifests
          path: artifacts/winget
